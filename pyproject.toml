[build-system]
requires = ["uv_build >= 0.10.0, <0.11.0"]
build-backend = "uv_build"

[project]
name = "paperlessngx_default_parser"
version = "v2.0.0"
authors = [
  { name="toweosp", email="dev@toweosp.org" },
]
description = "Default parser which can be used by Paperless-ngx if there is no other suitable parser found for a given mime type."
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "GPL-3.0-only"
license-files = ["LICEN[CS]E*"]
dependencies = ["chardet"]

[project.urls]
Homepage = "https://github.com/toweosp/paperlessngx-default-parser"
Issues = "https://github.com/toweosp/paperlessngx-default-parser/issues"

